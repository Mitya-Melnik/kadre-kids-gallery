name: Mobile layouts and benefits preview
on:
  push:
    branches: [feature/mobile-layouts-benefits-v10]
permissions:
  contents: read
concurrency:
  group: mobile-layouts-benefits-v10
  cancel-in-progress: true
jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 24
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build current and frozen v9 source, test original assets and rules
        timeout-minutes: 4
        run: |
          test ! -f scripts/apply-mobile-v10.py
          npm ci --prefer-offline --no-audit --no-fund --fetch-retries=2 --fetch-timeout=30000
          npm run build
          git worktree add /tmp/v10-base 09d2757fd6de2e3a534aa9c7d2677a3c822f470f
          ln -s "$GITHUB_WORKSPACE/node_modules" /tmp/v10-base/node_modules
          npm --prefix /tmp/v10-base run build
          node scripts/check-mobile-types.cjs /tmp/v10-base
          node --test scripts/test-album-commercial.mjs scripts/test-album-enquiry.mjs scripts/test-grade4-enquiry.mjs scripts/test-school-order-rules.mjs scripts/test-mobile-v10.mjs
          git diff --exit-code 09d2757fd6de2e3a534aa9c7d2677a3c822f470f HEAD -- public src/assets server package-lock.json src/config/albumPackages.ts src/config/albumOrderRules.ts
          python -m py_compile scripts/check-mobile-v10.py
      - name: Install pinned browser test tools
        timeout-minutes: 6
        run: |
          pip install --timeout 30 --retries 2 playwright==1.55.0 Pillow==11.3.0 numpy==2.3.3
          playwright install --with-deps chromium webkit
      - name: Compare mobile changes, preserved desktop, and capture preview
        timeout-minutes: 13
        run: |
          npm run preview -- --host 127.0.0.1 --port 4173 > /tmp/v10-after.log 2>&1 &
          npm --prefix /tmp/v10-base run preview -- --host 127.0.0.1 --port 4174 > /tmp/v10-before.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null && curl -fsS http://127.0.0.1:4174/ >/dev/null; then break; fi
            sleep 1
          done
          set +e
          python scripts/check-mobile-v10.py http://127.0.0.1:4173 http://127.0.0.1:4174 mobile-v10-results
          check_status=$?
          python scripts/capture-mobile-site.py http://127.0.0.1:4173 mobile-site-results
          capture_status=$?
          test "$check_status" -eq 0 && test "$capture_status" -eq 0
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mobile-layouts-benefits-v10-review
          path: |
            mobile-v10-results/
            mobile-site-results/
            mobile-preview-results/types.json
          retention-days: 14
