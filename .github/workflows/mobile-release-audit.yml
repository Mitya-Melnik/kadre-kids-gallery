name: Mobile release audit and rollback snapshots
on:
  push:
    branches: [release/kindergarten-mobile-2026-10-01]
permissions:
  contents: read
concurrency:
  group: mobile-release-audit-2026-10-01
  cancel-in-progress: true
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Preserve frozen sources and build original, candidate and commerce-only reference
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-audit backup-source
          git archive --format=zip --output=backup-source/source-before-30469af.zip 30469af610eea3ebfac226bf3b86e3b407700f4c
          git archive --format=zip --output=/tmp/source-approved.zip a3be32716edb16db77a09a059025cd0c00492d46
          git diff 30469af610eea3ebfac226bf3b86e3b407700f4c a3be32716edb16db77a09a059025cd0c00492d46 > release-audit/cumulative.patch
          git diff --name-status 30469af610eea3ebfac226bf3b86e3b407700f4c a3be32716edb16db77a09a059025cd0c00492d46 > release-audit/changed-files.txt
          git worktree add /tmp/desktop-before 30469af610eea3ebfac226bf3b86e3b407700f4c
          git worktree add --detach /tmp/desktop-reference 30469af610eea3ebfac226bf3b86e3b407700f4c
          for f in src/config/albumCommercial.ts src/config/albumPackages.ts src/components/AlbumPromoStrip.tsx src/components/FAQ.tsx src/components/kindergarten/AlbumCatalog.tsx; do
            cp "$f" "/tmp/desktop-reference/$f"
          done
          python - <<'PY'
          from pathlib import Path
          p=Path('/tmp/desktop-reference/src/components/kindergarten/KindergartenFAQ.tsx')
          s=p.read_text(); old='return faq.answer\n        .replace(/группы или класса/g, "класса")'
          assert old in s
          p.write_text(s.replace(old,'return faq.answer\n        .replace(/История детства/g, "Школьные годы")\n        .replace(/группы или класса/g, "класса")'))
          PY
          git -C /tmp/desktop-reference diff > release-audit/commerce-only-reference.patch
          npm ci
          npm run build
          ln -s "$GITHUB_WORKSPACE/node_modules" /tmp/desktop-before/node_modules
          ln -s "$GITHUB_WORKSPACE/node_modules" /tmp/desktop-reference/node_modules
          npm --prefix /tmp/desktop-before run build
          npm --prefix /tmp/desktop-reference run build
          node scripts/check-mobile-types.cjs /tmp/desktop-before
          node --test scripts/test-album-commercial.mjs scripts/test-album-enquiry.mjs > release-audit/node-tests.txt
          cp mobile-preview-results/types.json release-audit/types.json
          python - <<'PY'
          import zipfile
          from pathlib import Path
          # Code snapshots for inspection. Complete source rollback stays separately in GitHub/backup-source.
          for src,name in [('backup-source/source-before-30469af.zip','before-code.zip'),('/tmp/source-approved.zip','approved-code.zip')]:
              with zipfile.ZipFile(src) as source,zipfile.ZipFile('release-audit/'+name,'w',zipfile.ZIP_DEFLATED) as out:
                  for item in source.infolist():
                      if not item.is_dir() and not item.filename.startswith(('public/','src/assets/')): out.writestr(item.filename,source.read(item))
          excluded={'.mp4','.mov','.webm','.avi'}
          for root,name in [(Path('dist'),'approved-build.zip'),(Path('/tmp/desktop-before/dist'),'before-build.zip'),(Path('/tmp/desktop-reference/dist'),'reference-build.zip')]:
              with zipfile.ZipFile('release-audit/'+name,'w',zipfile.ZIP_DEFLATED) as out:
                  for p in root.rglob('*'):
                      if p.is_file() and p.suffix.lower() not in excluded: out.write(p,p.relative_to(root))
          Path('release-audit/README.txt').write_text('Original main: 30469af610eea3ebfac226bf3b86e3b407700f4c\nApproved app: a3be32716edb16db77a09a059025cd0c00492d46\nDesktop reference = original main plus six explicitly listed approved commercial-text files/edits, not mobile UI.\nLightweight review builds omit videos; code inspection archives omit public and src/assets. Full original tracked source separately in backup-source artifact and persistent backup branch.\nNo deployment, production secrets, server disk backup or live lead submission.\n')
          PY
      - name: Read-only public availability check
        shell: bash
        run: |
          python - <<'PY'
          import json, socket, urllib.request, datetime
          from pathlib import Path
          result={'checked_at':datetime.datetime.now(datetime.timezone.utc).isoformat(),'requests':[]}
          try: result['addresses']=sorted({i[4][0] for i in socket.getaddrinfo('detivkadre.spb.ru',443)})
          except Exception as e: result['dns_error']=str(e)
          for path in ['/', '/kindergarten']:
              url='https://detivkadre.spb.ru'+path; entry={'url':url}
              try:
                  with urllib.request.urlopen(urllib.request.Request(url,headers={'User-Agent':'Deti-v-kadre-release-check/1.0'}),timeout=15) as response:
                      body=response.read(100000).decode('utf-8','replace')
                      entry.update(status=response.status,final_url=response.url,headers=dict(response.headers))
                      Path('release-audit/live-'+('home' if path=='/' else 'kindergarten')+'.html').write_text(body)
              except Exception as e: entry['error']=str(e)
              result['requests'].append(entry)
          Path('release-audit/availability.json').write_text(json.dumps(result,ensure_ascii=False,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mobile-release-review-small
          path: release-audit/
          retention-days: 30
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: source-backup-before-mobile-30469af
          path: backup-source/
          retention-days: 90
