name: Kindergarten mobile content preview
on:
  push:
    branches: [feature/kindergarten-mobile-content-v3]
permissions:
  contents: read
concurrency:
  group: kindergarten-content-preview
  cancel-in-progress: true
jobs:
  browser-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build candidate and approved catalog baseline
        run: |
          npm ci
          npm run build
          git worktree add /tmp/content-baseline 99ecb343f68685b2bc0f033e31587c8e7478b77e
          ln -s "$GITHUB_WORKSPACE/node_modules" /tmp/content-baseline/node_modules
          npm --prefix /tmp/content-baseline run build
          node scripts/check-mobile-types.cjs /tmp/content-baseline
      - name: Browser checks without deployment or live leads
        run: |
          pip install playwright==1.55.0 Pillow==11.3.0
          playwright install --with-deps chromium webkit
          npm run preview -- --host 127.0.0.1 --port 4173 > /tmp/content-candidate.log 2>&1 &
          npm --prefix /tmp/content-baseline run preview -- --host 127.0.0.1 --port 4174 > /tmp/content-baseline.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:4173/ > /dev/null && curl -fsS http://127.0.0.1:4174/ > /dev/null; then break; fi
            sleep 1
          done
          status=0
          python scripts/check-kindergarten-catalog-v2.py http://127.0.0.1:4173 http://127.0.0.1:4174 mobile-preview-results || status=$?
          python scripts/check-kindergarten-content-v3.py http://127.0.0.1:4173 http://127.0.0.1:4174 mobile-preview-results || status=$?
          exit "$status"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kindergarten-content-v3-review
          path: mobile-preview-results/
          retention-days: 14
