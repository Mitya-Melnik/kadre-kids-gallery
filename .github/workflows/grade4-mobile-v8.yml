name: Grade 4 mobile preview
on:
  push:
    branches: [feature/grade4-mobile-v8]
permissions:
  contents: read
concurrency:
  group: grade4-mobile-v8
  cancel-in-progress: true
jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build candidate and frozen baseline, test routing with a mock CRM
        run: |
          npm ci
          npm run build
          git worktree add /tmp/grade4-base 1673a16afef562525406f126626f5efbad41a8dc
          ln -s "$GITHUB_WORKSPACE/node_modules" /tmp/grade4-base/node_modules
          npm --prefix /tmp/grade4-base run build
          node scripts/check-mobile-types.cjs /tmp/grade4-base
          node --test scripts/test-album-commercial.mjs scripts/test-album-enquiry.mjs scripts/test-grade4-enquiry.mjs
          python -m py_compile scripts/check-grade4-mobile-v8.py scripts/check-grade4-regression.py
          pip install playwright==1.55.0 Pillow==11.3.0 numpy==2.3.3
          playwright install --with-deps chromium webkit
      - name: Read-only browser checks and review captures
        run: |
          npm run preview -- --host 127.0.0.1 --port 4173 > /tmp/grade4-after.log 2>&1 &
          npm --prefix /tmp/grade4-base run preview -- --host 127.0.0.1 --port 4174 > /tmp/grade4-before.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:4173/ > /dev/null && curl -fsS http://127.0.0.1:4174/ > /dev/null; then break; fi
            sleep 1
          done
          set +e
          python scripts/check-grade4-mobile-v8.py http://127.0.0.1:4173 http://127.0.0.1:4174 grade4-results
          mobile_status=$?
          python scripts/check-grade4-regression.py 4173 4174 grade4-regression
          regression_status=$?
          python scripts/capture-mobile-site.py http://127.0.0.1:4173 mobile-site-results
          capture_status=$?
          test "$mobile_status" -eq 0 && test "$regression_status" -eq 0 && test "$capture_status" -eq 0
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: grade4-mobile-v8-review
          path: |
            grade4-results/
            grade4-regression/
            mobile-site-results/
            mobile-preview-results/types.json
          retention-days: 14
