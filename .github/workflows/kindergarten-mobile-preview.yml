name: Kindergarten mobile preview checks
on:
  push:
    branches: [feature/kindergarten-mobile-v1]
permissions:
  contents: read
concurrency:
  group: kindergarten-mobile-preview
  cancel-in-progress: true
jobs:
  browser-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install and build candidate
        run: |
          npm ci
          npm run build
          node scripts/check-mobile-types.cjs
      - name: Build unchanged baseline
        run: |
          git worktree add /tmp/mobile-baseline 30469af610eea3ebfac226bf3b86e3b407700f4c
          ln -s "$GITHUB_WORKSPACE/node_modules" /tmp/mobile-baseline/node_modules
          npm --prefix /tmp/mobile-baseline run build
      - name: Browser checks (no deployment, no live leads)
        run: |
          pip install playwright==1.55.0 Pillow==11.3.0
          playwright install --with-deps chromium
          npm run preview -- --host 127.0.0.1 --port 4173 > /tmp/candidate-preview.log 2>&1 &
          npm --prefix /tmp/mobile-baseline run preview -- --host 127.0.0.1 --port 4174 > /tmp/baseline-preview.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:4173/ > /dev/null && curl -fsS http://127.0.0.1:4174/ > /dev/null; then break; fi
            sleep 1
          done
          python scripts/check-kindergarten-mobile.py http://127.0.0.1:4173 http://127.0.0.1:4174 mobile-preview-results
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kindergarten-mobile-before-after
          path: mobile-preview-results/
          retention-days: 14
