name: Senior school mobile preview
on:
  push:
    branches: [feature/senior-mobile-v9]
permissions:
  contents: read
concurrency:
  group: senior-mobile-v9
  cancel-in-progress: true
jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Export tracked source for isolated local editing
        run: |
          mkdir -p review-workspace
          git archive --format=tar HEAD src server scripts docs .github package.json package-lock.json index.html components.json eslint.config.js postcss.config.js tailwind.config.ts tsconfig.json tsconfig.app.json tsconfig.node.json vite.config.ts > review-workspace/source.tar
          git rev-parse HEAD > review-workspace/commit.txt
      - uses: actions/upload-artifact@v4
        with:
          name: senior-mobile-v9-workspace
          path: review-workspace/
          retention-days: 7
