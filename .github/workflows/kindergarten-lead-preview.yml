name: Kindergarten enquiry preview
on:
  push:
    branches: [feature/kindergarten-mobile-lead-v4]
permissions:
  contents: read
concurrency:
  group: kindergarten-lead-preview
  cancel-in-progress: true
jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        if: hashFiles('scripts/stage-kindergarten-enquiry-v4.py') == ''
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        if: hashFiles('scripts/stage-kindergarten-enquiry-v4.py') == ''
        with:
          python-version: '3.12'
      - name: Build and test without deployment or live leads
        if: hashFiles('scripts/stage-kindergarten-enquiry-v4.py') == ''
        run: |
          npm ci
          npm run build
          git worktree add /tmp/approved-content 67da4ff038bda1280ecc88864bdc69c552c55149
          ln -s "$GITHUB_WORKSPACE/node_modules" /tmp/approved-content/node_modules
          npm --prefix /tmp/approved-content run build
          node scripts/check-mobile-types.cjs /tmp/approved-content
          node --test scripts/test-album-enquiry.mjs
          pip install playwright==1.55.0 Pillow==11.3.0
          playwright install --with-deps chromium webkit
          npm run preview -- --host 127.0.0.1 --port 4173 > /tmp/enquiry-preview.log 2>&1 &
          npm --prefix /tmp/approved-content run preview -- --host 127.0.0.1 --port 4174 > /tmp/approved-preview.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:4173/ > /dev/null && curl -fsS http://127.0.0.1:4174/ > /dev/null; then break; fi
            sleep 1
          done
          python scripts/check-kindergarten-lead.py http://127.0.0.1:4173 http://127.0.0.1:4174 mobile-lead-results
      - uses: actions/upload-artifact@v4
        if: always() && hashFiles('scripts/stage-kindergarten-enquiry-v4.py') == ''
        with:
          name: kindergarten-lead-v4-review
          path: |
            mobile-lead-results/
            mobile-preview-results/types.json
          retention-days: 14
