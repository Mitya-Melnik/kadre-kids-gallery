name: Mobile spacing and selector preview
on:
  push:
    branches: [feature/mobile-spacing-selector-v5]
permissions:
  contents: read
concurrency:
  group: mobile-finishing-v5
  cancel-in-progress: true
jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build candidate and approved baseline
        run: |
          npm ci
          npm run build
          git worktree add /tmp/v5-baseline c4b7bfa6538d754fdbca3fee22f864cf1f8fb359
          ln -s "$GITHUB_WORKSPACE/node_modules" /tmp/v5-baseline/node_modules
          npm --prefix /tmp/v5-baseline run build
          node scripts/check-mobile-types.cjs /tmp/v5-baseline
          node --test scripts/test-album-enquiry.mjs scripts/test-album-commercial.mjs
      - name: Browser review without deployment or live leads
        run: |
          pip install playwright==1.55.0 Pillow==11.3.0
          playwright install --with-deps chromium webkit
          npm run preview -- --host 127.0.0.1 --port 4173 > /tmp/v5-preview.log 2>&1 &
          npm --prefix /tmp/v5-baseline run preview -- --host 127.0.0.1 --port 4174 > /tmp/v5-baseline.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:4173/ > /dev/null && curl -fsS http://127.0.0.1:4174/ > /dev/null; then break; fi
            sleep 1
          done
          status=0
          python scripts/check-mobile-finishing-v5.py http://127.0.0.1:4173 http://127.0.0.1:4174 mobile-finishing-results || status=$?
          python scripts/capture-mobile-site.py http://127.0.0.1:4173 mobile-site-results || status=$?
          exit "$status"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mobile-finishing-v5-review
          path: |
            mobile-finishing-results/
            mobile-site-results/
            mobile-preview-results/types.json
          retention-days: 14
