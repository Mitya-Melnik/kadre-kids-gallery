# =========================
# detivkadre.spb.ru — Nginx
# =========================

# 1) Редирект с www на основной домен (HTTP)
server {
  listen 80;
  server_name www.detivkadre.spb.ru;
  return 301 http://detivkadre.spb.ru$request_uri;
}

# 2) Основной сайт (HTTP)
server {
  listen 80;
  server_name detivkadre.spb.ru;

  # Корень со статикой (сюда попадает vite/dist)
  root  /usr/share/nginx/html;
  index index.html;

  # HTML всегда проверяем на сервере: иначе после обновления браузер
  # может запрашивать уже удалённые JS/CSS-файлы из старой сборки.
  location = /index.html {
    expires -1;
    add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    try_files /index.html =404;
  }

  # Health-check
  location = /healthz {
    add_header Content-Type text/plain;
    return 200 'ok';
  }

  # Короткие брендированные ссылки для рекламных сообщений в MAX.
  # Внешне ссылки остаются короткими, а Метрика получает полные UTM-метки.
  location = /go/max-director {
    return 302 "/kindergarten?utm_source=max&utm_medium=forward&utm_campaign=kindergarten_albums_2026&utm_content=director_to_parents";
  }

  location = /go/max-parents {
    return 302 "/kindergarten?utm_source=max&utm_medium=direct_message&utm_campaign=kindergarten_albums_2026&utm_content=direct_to_parents";
  }

  location = /go/max-channel {
    return 302 "/kindergarten?utm_source=max&utm_medium=channel&utm_campaign=kindergarten_albums_2026&utm_content=channel_post";
  }

  # ==== 0) НОВЫЕ ПАПКИ: БЕЗ КЭША (ГАРАНТИЯ, ЧТО НОВЫЕ ФОТО ВИДНЫ СРАЗУ) ====

  # /kindergarten/hero-square/** (прямой путь)
  location ^~ /kindergarten/hero-square/ {
    expires off;
    add_header Cache-Control "no-store";
    try_files $uri =404;
  }
  # /{section}/kindergarten/hero-square/** (если открыт вложенный роут)
  location ~* ^/[^/]+/kindergarten/hero-square/(.*)$ {
    alias /usr/share/nginx/html/kindergarten/hero-square/$1;
    expires off;
    add_header Cache-Control "no-store";
    try_files $uri =404;
  }

  # /kindergarten-gallery/** (прямой путь)
  location ^~ /kindergarten-gallery/ {
    expires off;
    add_header Cache-Control "no-store";
    try_files $uri =404;
  }
  # /{section}/kindergarten-gallery/** (если открыт вложенный роут)
  location ~* ^/[^/]+/kindergarten-gallery/(.*)$ {
    alias /usr/share/nginx/html/kindergarten-gallery/$1;
    expires off;
    add_header Cache-Control "no-store";
    try_files $uri =404;
  }

  # ==== 1) СТРАХОВКА ДЛЯ ПРОЧИХ ПАПОК (мягкий кэш 10 минут) ====
  # Примеры:
  #   /kindergarten/galleries/...        -> /galleries/...
  #   /kindergarten/layouts/...          -> /layouts/...
  #   /kindergarten/albums/...           -> /albums/...
  #   /kindergarten/lovable-uploads/...  -> /lovable-uploads/...
  location ~* ^/[^/]+/(albums|galleries|layouts|lovable-uploads)/(.*)$ {
    alias /usr/share/nginx/html/$1/$2;
    expires 10m;
    add_header Cache-Control "public, max-age=600";
    try_files $uri =404;
  }

  # ==== 2) ОБЩИЙ КЭШ ДЛЯ СТАТИКИ (10 минут) ====
  location ~* \.(?:js|mjs|css|png|jpg|jpeg|gif|svg|ico|webp|avif|woff2?|ttf|otf|mp4|webm|mov)$ {
    expires 10m;
    add_header Cache-Control "public, max-age=600";
    try_files $uri =404;
  }

  # ==== 3) SPA-ФОЛБЭК ====
  # Без $uri/ — чтобы не ловить 403/404 на каталогах
  location / {
    try_files $uri /index.html;
  }
}
