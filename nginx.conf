# 1) www -> без www (HTTP)
server {
  listen 80;
  server_name www.detivkadre.spb.ru;
  return 301 http://detivkadre.spb.ru$request_uri;
}

# 2) Основной сайт (HTTP)
server {
  listen 80;
  server_name detivkadre.spb.ru;

  # Папка со статикой (туда копируем dist)
  root /usr/share/nginx/html;
  index index.html;

  # Health-check (на всякий случай)
  location = /healthz {
    add_header Content-Type text/plain;
    return 200 'ok';
  }

  # SPA-роутинг
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Кеш статики
  location ~* \.(?:js|css|png|jpg|jpeg|gif|svg|ico|webp|woff2?)$ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }
}
