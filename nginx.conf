# =========================
# detivkadre.spb.ru — Nginx
# =========================

# 1) Редирект c www на основной домен (HTTP)
server {
  listen 80;
  server_name www.detivkadre.spb.ru;
  return 301 http://detivkadre.spb.ru$request_uri;
}

# 2) Основной сайт (HTTP)
server {
  listen 80;
  server_name detivkadre.spb.ru;

  # Корень со статикой (сюда копируется vite/dist)
  root  /usr/share/nginx/html;
  index index.html;

  # Health-check
  location = /healthz {
    add_header Content-Type text/plain;
    return 200 'ok';
  }

  # ---- Страховка для ассетов, когда страница открыта на подмаршруте ----
  # Пример: /kindergarten/layouts/s1/1.webp  -> /layouts/s1/1.webp
  #         /kindergarten/albums/…          -> /albums/…
  #         /kindergarten/galleries/…       -> /galleries/…
  #         /kindergarten/lovable-uploads/… -> /lovable-uploads/…
  location ~* ^/[^/]+/(layouts|albums|galleries|lovable-uploads)/(.*)$ {
    alias /usr/share/nginx/html/$1/$2;
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  # Общий кэш статики
  location ~* \.(?:js|mjs|css|png|jpg|jpeg|gif|svg|ico|webp|avif|woff2?|ttf|otf)$ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  # SPA-роутинг:
  # ВАЖНО: без $uri/ — так исключаем ложный 403/404 на каталогах
  location / {
    try_files $uri /index.html;
  }
}
