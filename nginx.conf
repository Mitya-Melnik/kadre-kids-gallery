# 1) www → без www (HTTP)
server {
  listen 80;
  server_name www.detivkadre.spb.ru;
  return 301 http://detivkadre.spb.ru$request_uri;
}

# 2) Основной сайт (HTTP)
server {
  listen 80;
  server_name detivkadre.spb.ru;

  root  /usr/share/nginx/html;
  index index.html;

  # Health-check
  location = /healthz {
    add_header Content-Type text/plain;
    return 200 'ok';
  }

  # ====== БЛОКИ ДЛЯ ФОТО/АЛЬБОМОВ ======

  # (A) Прямой доступ к /public-layouts/** + временный листинг (диагностика)
  location ^~ /public-layouts/ {
    root /usr/share/nginx/html;
    autoindex on;                 # ← можно выключить после проверки
    autoindex_exact_size off;
    autoindex_localtime on;
    expires off;
    add_header Cache-Control "no-store";
    try_files $uri =404;
  }

  # (B) Маршруты вида /{section}/public-layouts/** → /public-layouts/**
  location ~* ^/[^/]+/public-layouts/(.*)$ {
    rewrite ^/[^/]+/public-layouts/(.*)$ /public-layouts/$1 break;
    try_files /public-layouts/$1 =404;
  }

  # (C) Оставим и «старые» галереи (если где-то ииспользуются)
  location ^~ /galleries/ {
    root /usr/share/nginx/html;
    autoindex on;                 # ← можно выключить после проверки
    autoindex_exact_size off;
    autoindex_localtime on;
    expires off;
    add_header Cache-Control "no-store";
    try_files $uri =404;
  }

  location ~* ^/[^/]+/galleries/(.*)$ {
    rewrite ^/[^/]+/galleries/(.*)$ /galleries/$1 break;
    try_files /galleries/$1 =404;
  }

  # ====== СТАТИКА И SPA ======

  # Статика проекта
  location ~* \.(?:js|css|png|jpg|jpeg|gif|svg|ico|webp|woff2?)$ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  # SPA-фолбэк (без проверки каталога, чтобы не ловить 403)
  location / {
    try_files $uri /index.html;
  }
}
