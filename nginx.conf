# 1) www → без www (HTTP)
server {
  listen 80;
  server_name www.detivkadre.spb.ru;
  return 301 http://detivkadre.spb.ru$request_uri;
}

# 2) Основной сайт (HTTP)
server {
  listen 80;
  server_name detivkadre.spb.ru;

  # Папка со статикой (куда копируется dist)
  root  /usr/share/nginx/html;
  index index.html;

  # Health-check
  location = /healthz {
    add_header Content-Type text/plain;
    return 200 'ok';
  }

  # --- ГАЛЕРЕИ: жёсткая переадресация путей ---
  # Любые запросы вида /{любой-раздел}/galleries/** переписываем на /galleries/**
  # Примеры:
  #   /kindergarten/galleries/s1/1.webp -> /galleries/s1/1.webp
  #   /school/galleries/x/cover.webp    -> /galleries/x/cover.webp
  location ~* ^/[^/]+/galleries/(.*)$ {
    # на время диагностики отключаем кэш, чтобы не мешал "immutable"
    expires off;
    add_header Cache-Control "no-store";

    # переписываем URI и сразу ищем файл в файловой системе
    rewrite ^/[^/]+/galleries/(.*)$ /galleries/$1 break;
    try_files /galleries/$1 =404;
  }

  # Кеш статики (общий случай)
  location ~* \.(?:js|css|png|jpg|jpeg|gif|svg|ico|webp|woff2?)$ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  # SPA-роутинг (без проверки каталога, чтобы не ловить 403)
  location / {
    try_files $uri /index.html;
  }
}
