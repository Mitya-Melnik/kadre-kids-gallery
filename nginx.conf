# 1) www → без www (HTTP)
server {
  listen 80;
  server_name www.detivkadre.spb.ru;
  return 301 http://detivkadre.spb.ru$request_uri;
}

# 2) Основной сайт (HTTP)
server {
  listen 80;
  server_name detivkadre.spb.ru;

  root  /usr/share/nginx/html;
  index index.html;

  # Health-check
  location = /healthz {
    add_header Content-Type text/plain;
    return 200 'ok';
  }

  # --- ПРАВИЛА ДЛЯ СТАТИКИ ИЗ /public ---
  # Если перед целевой папкой есть любой префикс (напр. /kindergarten/layouts/...),
  # переписываем на абсолютный путь от корня (/layouts/..., /galleries/..., и т.д.)
  # Перечислены реальные папки из твоего /public: layouts, galleries, albums,
  # lovable-uploads, kindergarten, kindergarten-gallery
  location ~* ^/(?:[^/]+/)+(layouts|galleries|albums|lovable-uploads|kindergarten|kindergarten-gallery)/(.*)$ {
    rewrite ^/(?:[^/]+/)+(layouts|galleries|albums|lovable-uploads|kindergarten|kindergarten-gallery)/(.*)$ /$1/$2 break;
    try_files /$1/$2 =404;
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  # Прямые обращения к этим папкам (когда путь уже абсолютный)
  location ~* ^/(layouts|galleries|albums|lovable-uploads|kindergarten|kindergarten-gallery)/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  # Кеш статики по расширениям (скрипты/стили/картинки и т.п.)
  location ~* \.(?:js|css|png|jpg|jpeg|gif|svg|ico|webp|woff2?)$ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  # SPA-фолбэк (без проверки каталога, чтобы не ловить 403)
  location / {
    try_files $uri /index.html;
  }
}

