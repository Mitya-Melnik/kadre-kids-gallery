# =========================
# detivkadre.spb.ru — Nginx
# =========================

# 1) Редирект c www на основной домен (HTTP)
server {
  listen 80;
  server_name www.detivkadre.spb.ru;
  return 301 http://detivkadre.spb.ru$request_uri;
}

# 2) Основной сайт (HTTP)
server {
  listen 80;
  server_name detivkadre.spb.ru;

  # Корень со статикой (сюда копируется vite/dist)
  root  /usr/share/nginx/html;
  index index.html;

  # Health-check
  location = /healthz {
    add_header Content-Type text/plain;
    return 200 'ok';
  }

  # ---- СТРАХОВКА для ассетов, когда страница открыта на подмаршруте ----
  # Пример: /kindergarten/galleries/s1/1.webp -> /galleries/s1/1.webp
  #         /kindergarten/albums/...          -> /albums/...
  #         /kindergarten/layouts/...         -> /layouts/...
  #         /kindergarten/lovable-uploads/... -> /lovable-uploads/...
  #         /kindergarten/kindergarten-gallery/... -> /kindergarten-gallery/...
  location ~* ^/[^/]+/(layouts|albums|galleries|lovable-uploads|kindergarten-gallery)/(.*)$ {
    alias /usr/share/nginx/html/$1/$2;
    # короткий кеш, чтобы новые файлы появлялись быстро
    expires 1m;
    add_header Cache-Control "public, max-age=60, must-revalidate";
    try_files $uri =404;
  }

  # --- ЯВНЫЕ БЛОКИ для папок, где добавляешь новые фото ---
  # 1) Прямая загрузка из /kindergarten/hero-square/*
  location ^~ /kindergarten/hero-square/ {
    # короткий кеш ровно для этой папки
    expires 1m;
    add_header Cache-Control "public, max-age=60, must-revalidate";
    try_files $uri =404;
  }

  # 2) Прямая загрузка из /kindergarten-gallery/*
  location ^~ /kindergarten-gallery/ {
    # короткий кеш ровно для этой папки
    expires 1m;
    add_header Cache-Control "public, max-age=60, must-revalidate";
    try_files $uri =404;
  }

  # --- Общий кэш статики (ассеты Vite, обычные картинки/шрифты/видео) ---
  # этот блок идёт ПОСЛЕ alias/спец-блоков
  location ~* \.(?:js|mjs|css|png|jpg|jpeg|gif|svg|ico|webp|avif|mp4|mov|woff2?|ttf|otf)$ {
    # можно увеличить до 1d/1y для файлов с хэшами
    expires 1h;
    add_header Cache-Control "public";
    try_files $uri =404;
  }

  # --- SPA-роутинг ---
  location / {
    try_files $uri /index.html;
  }
}
