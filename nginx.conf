# 1) www → без www (HTTP)
server {
  listen 80;
  server_name www.detivkadre.spb.ru;
  return 301 http://detivkadre.spb.ru$request_uri;
}

# 2) Основной сайт (HTTP)
server {
  listen 80;
  server_name detivkadre.spb.ru;

  # Папка со статикой (куда копируем dist)
  root  /usr/share/nginx/html;
  index index.html;

  # Health-check
  location = /healthz {
    add_header Content-Type text/plain;
    return 200 'ok';
  }

  # --- СТРАХОВКА ДЛЯ ФОТО ---
  # Любые пути вида /{любая_страница}/galleries/** отдаем из /galleries/**
  # Пример: /kindergarten/galleries/s1/p1.webp -> /galleries/s1/p1.webp
  location ~* ^/[^/]+/galleries/(.*)$ {
    alias /usr/share/nginx/html/galleries/$1;
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  # Кеш статики (общий случай)
  location ~* \.(?:js|css|png|jpg|jpeg|gif|svg|ico|webp|woff2?)$ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  # SPA-роутинг (без проверки каталога, чтобы не ловить 403)
  location / {
    try_files $uri /index.html;
  }
}
