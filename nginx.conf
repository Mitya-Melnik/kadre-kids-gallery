# =========================
# detivkadre.spb.ru — Nginx
# =========================

# 1) Редирект с www на основной домен (HTTP)
server {
  listen 80;
  server_name www.detivkadre.spb.ru;
  return 301 http://detivkadre.spb.ru$request_uri;
}

# 2) Основной сайт (HTTP)
server {
  listen 80;
  server_name detivkadre.spb.ru;

  # Корень статики (сюда копируется vite/dist)
  root  /usr/share/nginx/html;
  index index.html;

  # Health-check
  location = /healthz {
    add_header Content-Type text/plain;
    return 200 'ok';
  }

  # --- Страховка для ассетов при открытии подмаршрутов ---
  # Любые запросы вида /{любая_страница}/(layouts|albums|galleries|lovable-uploads|kindergarten-gallery)/...
  # переписываем во внутрисерверный путь без первого сегмента.
  # НИКАКИХ alias — только rewrite -> упрётся в обычную раздачу статики ниже.
  location ~* ^/[^/]+/(layouts|albums|galleries|lovable-uploads|kindergarten-gallery)/(.*)$ {
    rewrite ^/[^/]+/(layouts|albums|galleries|lovable-uploads|kindergarten-gallery)/(.*)$ /$1/$2 break;
  }

  # --- Раздача статики (ассеты, фото, видео, шрифты) ---
  # Небольшой кеш для ускорения. Для файлов с хэшами можно увеличить до 1y.
  location ~* \.(?:js|mjs|css|png|jpg|jpeg|gif|svg|ico|webp|avif|mp4|mov|woff2?|ttf|otf)$ {
    expires 1h;
    add_header Cache-Control "public";
    try_files $uri =404;
  }

  # --- SPA-роутинг ---
  # ВАЖНО: без $uri/ — чтобы не ловить 403/404 на «каталогах»
  location / {
    try_files $uri /index.html;
  }
}
