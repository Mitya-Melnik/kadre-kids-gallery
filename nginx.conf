server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # SPA-роутинг: если файл не найден — отдаём index.html
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Кэш для статики (ускоряет загрузку)
  location ~* \.(js|css|png|jpg|jpeg|gif|svg|ico|webp|woff2?)$ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }
}
