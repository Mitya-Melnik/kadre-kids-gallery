# Один безопасный сервер-блок, чтобы гарантированно подняться
server {
  listen 80 default_server;
  server_name _;

  # Корень статики (Vite копирует сюда dist)
  root  /usr/share/nginx/html;
  index index.html;

  # Health-check
  location = /healthz {
    add_header Content-Type text/plain;
    return 200 'ok';
  }

  # Подхватываем ассеты с подмаршрутов:
  # /kindergarten/(layouts|albums|galleries|lovable-uploads|kindergarten-gallery)/... -> /... без первого сегмента
  location ~* ^/[^/]+/(layouts|albums|galleries|lovable-uploads|kindergarten-gallery)/(.*)$ {
    rewrite ^/[^/]+/(layouts|albums|galleries|lovable-uploads|kindergarten-gallery)/(.*)$ /$1/$2 break;
  }

  # Раздача статики (фото/видео/шрифты и т.д.)
  location ~* \.(?:js|mjs|css|png|jpg|jpeg|gif|svg|ico|webp|avif|mp4|mov|woff2?|ttf|otf)$ {
    expires 1h;
    add_header Cache-Control "public";
    try_files $uri =404;
  }

  # SPA-роутинг
  location / {
    try_files $uri /index.html;
  }
}
