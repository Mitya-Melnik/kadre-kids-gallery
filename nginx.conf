# =========================
# detivkadre.spb.ru — Nginx
# =========================

# 1) Редирект с www на основной домен (HTTP)
server {
  listen 80;
  server_name www.detivkadre.spb.ru;
  return 301 http://detivkadre.spb.ru$request_uri;
}

# 2) Основной сайт (HTTP)
server {
  listen 80;
  server_name detivkadre.spb.ru;

  # Корень со статикой (сюда попадает vite/dist)
  root  /usr/share/nginx/html;
  index index.html;

  # Health-check
  location = /healthz {
    add_header Content-Type text/plain;
    return 200 'ok';
  }

  # ---- Алиасы для ассетов, когда страница открыта на вложенных маршрутах ----
  # Примеры:
  #   /kindergarten/galleries/..           -> /galleries/..
  #   /kindergarten/layouts/..             -> /layouts/..
  #   /kindergarten/albums/..              -> /albums/..
  #   /kindergarten/lovable-uploads/..     -> /lovable-uploads/..
  #   /kindergarten/kindergarten-gallery/..-> /kindergarten-gallery/..
  #   /kindergarten/hero-square/..         -> /kindergarten/hero-square/..
  location ~* ^/[^/]+/(albums|galleries|layouts|lovable-uploads|kindergarten-gallery)/(.*)$ {
    alias /usr/share/nginx/html/$1/$2;
    expires 10m;
    add_header Cache-Control "public, max-age=600";
    try_files $uri =404;
  }

  # Отдельный алиас для подпапок внутри /kindergarten (например hero-square)
  location ~* ^/[^/]+/kindergarten/(.+)$ {
    alias /usr/share/nginx/html/kindergarten/$1;
    expires 10m;
    add_header Cache-Control "public, max-age=600";
    try_files $uri =404;
  }

  # Общий кэш статики (ослаблен до 10 минут на время активных правок)
  location ~* \.(?:js|mjs|css|png|jpg|jpeg|gif|svg|ico|webp|avif|woff2?|ttf|otf|mp4|mov)$ {
    expires 10m;
    add_header Cache-Control "public, max-age=600";
    try_files $uri =404;
  }

  # SPA-роутинг: без $uri/ — чтобы не ловить ошибку каталога
  location / {
    try_files $uri /index.html;
  }
}
