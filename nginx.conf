# =========================
# detivkadre.spb.ru — Nginx
# =========================

# 1) Редирект c www на основной домен (HTTP)
server {
  listen 80;
  server_name www.detivkadre.spb.ru;
  return 301 http://detivkadre.spb.ru$request_uri;
}

# 2) Основной сайт (HTTP)
server {
  listen 80;
  server_name detivkadre.spb.ru;

  # Корень со статикой (сюда копируется vite/dist)
  root  /usr/share/nginx/html;
  index index.html;

  # Health-check
  location = /healthz {
    add_header Content-Type text/plain;
    return 200 'ok';
  }

  # ---- Страховка для ассетов, когда страница открыта на подмаршруте ----
  # Пример: /kindergarten/galleries/s1/1.webp -> /galleries/s1/1.webp
  # Работает для: layouts, albums, galleries, lovable-uploads, kindergarten-gallery
  location ~* ^/[^/]+/(layouts|albums|galleries|lovable-uploads|kindergarten-gallery)/(.*)$ {
    alias /usr/share/nginx/html/$1/$2;
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  # ---- Долгий кэш только для файлов с хэшами в имени (Vite-ассеты) ----
  # Примеры: /assets/app-8d3a4f2a.js, /assets/chunk-aaa111bb.css, картинки с -hash в имени
  location ~* ^/assets/.*-[a-f0-9]{8,}\.(?:js|mjs|css|png|jpg|jpeg|gif|svg|ico|webp|avif|woff2?|ttf|otf)$ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  # ---- Обычные (НЕ хэшированные) изображения/видео — короткий кэш ----
  # Это как раз твои папки из public: kindergarten/**, kindergarten-gallery/**, albums/**, galleries/** и т.д.
  location ~* \.(?:png|jpg|jpeg|gif|svg|ico|webp|avif|mp4|webm|mov|m4v)$ {
    expires 1h;
    add_header Cache-Control "public, max-age=3600, must-revalidate";
    try_files $uri =404;
  }

  # SPA-роутинг (без проверки каталога, чтобы не ловить 403/404)
  location / {
    try_files $uri /index.html;
  }
}
